name: 뉴스 키워드 모니터링

on:
  schedule:
    - cron: "*/5 * * * *"    # 5분마다 실행 (UTC 기준)
  workflow_dispatch:          # GitHub 화면에서 수동으로도 실행 가능

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install feedparser requests beautifulsoup4

      - name: 이전에 보낸 기사 목록 복원 (있으면)
        uses: actions/cache@v4
        with:
          path: seen_links.json
          key: seen-links-cache

      - name: 뉴스 확인 및 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_alert.py
